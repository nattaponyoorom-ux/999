<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RailQuote | ระบบคำนวณค่าเช่าตู้รถไฟ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a1020; --panel:#111a2e; --panel2:#17233b; --line:#23334f;
  --txt:#e9eefb; --mut:#96a8cc; --gold:#f0b429; --gold2:#ffd45e;
  --grn:#2dd4a7; --red:#ff6b6b; --blue:#4c8dff; --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--txt);line-height:1.65}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
/* ---------- NAV ---------- */
header{position:sticky;top:0;z-index:50;background:rgba(10,16,32,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:8px;height:64px}
.logo{font-weight:700;font-size:19px;display:flex;align-items:center;gap:8px;margin-right:auto}
.logo span{color:var(--gold)}
.nav a.lk{padding:8px 13px;border-radius:9px;color:var(--mut);font-size:14.5px;font-weight:500}
.nav a.lk:hover,.nav a.lk.on{color:var(--txt);background:var(--panel2)}
.burger{display:none;background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:8px 12px;border-radius:9px;cursor:pointer}
/* ---------- BUTTONS ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:11px;border:1px solid transparent;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:.18s}
.btn-g{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#2a1c00}
.btn-g:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-o{background:transparent;border-color:var(--line);color:var(--txt)}
.btn-o:hover{background:var(--panel2);border-color:var(--gold)}
.btn-d{background:#3a1620;border:1px solid #6b2230;color:var(--red)}
.btn-s{padding:7px 13px;font-size:13.5px;border-radius:9px}
/* ---------- HERO ---------- */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);
  background:radial-gradient(1000px 460px at 82% -10%,rgba(240,180,41,.20),transparent 62%),
             radial-gradient(760px 420px at 8% 110%,rgba(76,141,255,.18),transparent 60%),#0a1020}
.hero-in{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;padding:62px 0 70px}
.tagpill{display:inline-flex;align-items:center;gap:7px;background:rgba(240,180,41,.12);border:1px solid rgba(240,180,41,.35);color:var(--gold2);padding:6px 13px;border-radius:999px;font-size:13px;font-weight:600;margin-bottom:16px}
.hero h1{font-size:42px;line-height:1.28;font-weight:700;letter-spacing:-.5px}
.hero h1 em{font-style:normal;color:var(--gold);}
.hero p{color:var(--mut);margin:16px 0 26px;font-size:16.5px;max-width:540px}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap}
.train-art{background:linear-gradient(160deg,#1b2942,#0e1728);border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.train-art .win{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:14px 0}
.train-art .win i{height:44px;border-radius:7px;background:linear-gradient(180deg,#2b4370,#16233c);border:1px solid #31466e;display:block}
.rail{height:6px;background:repeating-linear-gradient(90deg,#2a3a5c 0 16px,transparent 16px 26px);border-radius:4px;margin-top:16px}
/* ---------- FEATURES ---------- */
.feat{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:-36px 0 0;position:relative;z-index:2}
.fcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.fcard b{display:block;font-size:15px;margin:8px 0 3px}
.fcard small{color:var(--mut);font-size:13px}
.ico{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:19px;background:var(--panel2);border:1px solid var(--line)}
/* ---------- SECTION ---------- */
section{padding:56px 0}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.sec-h h2{font-size:27px;font-weight:700}
.sec-h p{color:var(--mut);font-size:14.5px;margin-top:4px}
/* ---------- CARDS ---------- */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:.2s}
.card:hover{border-color:rgba(240,180,41,.5);transform:translateY(-3px);box-shadow:0 16px 38px rgba(0,0,0,.4)}
.thumb{height:172px;background:linear-gradient(135deg,#22355a,#131f36);display:grid;place-items:center;font-size:46px;position:relative;overflow:hidden}
.thumb img{height:100%;width:100%;object-fit:cover}
.badge{position:absolute;top:11px;left:11px;background:rgba(10,16,32,.82);border:1px solid var(--line);color:var(--gold2);font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px}
.card-b{padding:16px;display:flex;flex-direction:column;gap:11px;flex:1}
.card-b h3{font-size:17.5px;font-weight:700}
.cap{display:flex;gap:14px;flex-wrap:wrap;color:var(--mut);font-size:13.5px}
.cap i{font-style:normal}
.fx{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--panel2);border:1px solid var(--line);color:var(--mut);font-size:12px;padding:4px 9px;border-radius:8px}
.price{margin-top:auto;padding-top:11px;border-top:1px dashed var(--line);display:flex;align-items:baseline;gap:6px}
.price b{color:var(--gold);font-size:21px}
.price small{color:var(--mut);font-size:12.5px}
.card-act{display:flex;gap:8px}
.card-act .btn{flex:1}
/* ---------- FORM ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.frow{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.fg{display:flex;flex-direction:column;gap:7px;margin-bottom:16px;position:relative}
label{font-size:13.5px;font-weight:600;color:var(--mut)}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--txt);background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;width:100%;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(240,180,41,.14)}
select option{background:#17233b}
.drop{position:absolute;top:100%;left:0;right:0;z-index:30;background:#17233b;border:1px solid var(--line);border-radius:11px;margin-top:5px;max-height:240px;overflow:auto;box-shadow:0 18px 40px rgba(0,0,0,.55)}
.drop div{padding:10px 13px;cursor:pointer;font-size:14.5px;display:flex;justify-content:space-between;gap:10px}
.drop div:hover{background:#22335a}
.drop div small{color:var(--mut)}
.radios{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.radio{display:flex;gap:11px;align-items:flex-start;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);cursor:pointer;transition:.15s}
.radio:hover{border-color:#3a527e}
.radio.on{border-color:var(--gold);background:rgba(240,180,41,.09)}
.radio b{font-size:14.5px;display:block}
.radio small{color:var(--mut);font-size:12.5px}
.cks{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.ck{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--mut);background:var(--panel2);border:1px solid var(--line);padding:9px 11px;border-radius:10px;cursor:pointer}
.ck input{width:auto}
/* ---------- RESULT ---------- */
.bill{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.bill-h{padding:20px 22px;background:linear-gradient(135deg,#1b2942,#111a2e);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
.route{display:flex;align-items:center;gap:12px;font-size:19px;font-weight:700;flex-wrap:wrap}
.route .ar{color:var(--gold)}
table.bt{width:100%;border-collapse:collapse;font-size:14.5px}
table.bt th,table.bt td{padding:12px 22px;border-bottom:1px solid var(--line);text-align:left}
table.bt th{color:var(--mut);font-size:12.5px;text-transform:uppercase;letter-spacing:.6px;background:var(--panel2)}
table.bt td.n{text-align:right;font-variant-numeric:tabular-nums}
table.bt tr.sum td{font-weight:700;font-size:19px;color:var(--gold);background:rgba(240,180,41,.07);border-bottom:none}
.note{background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.3);color:#ffc2c2;border-radius:12px;padding:14px 16px;font-size:13.5px;margin-top:18px}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat .fcard b{font-size:24px;color:var(--gold)}
/* ---------- ADMIN ---------- */
.tabs{display:flex;gap:7px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:22px;padding-bottom:12px}
.tab{padding:9px 15px;border-radius:10px;background:var(--panel);border:1px solid var(--line);color:var(--mut);font-size:14px;font-weight:600;cursor:pointer}
.tab.on{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#2a1c00;border-color:transparent}
.tbl{width:100%;border-collapse:collapse;font-size:14px;background:var(--panel);border-radius:var(--r);overflow:hidden}
.tbl th,.tbl td{padding:11px 13px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl th{background:var(--panel2);color:var(--mut);font-size:12.5px;letter-spacing:.5px}
.tbl tr:last-child td{border-bottom:none}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
.modal{position:fixed;inset:0;background:rgba(5,9,18,.78);z-index:99;display:grid;place-items:center;padding:20px;backdrop-filter:blur(4px)}
.modal-in{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:720px;width:100%;max-height:88vh;overflow:auto;padding:24px}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.mh h3{font-size:20px}
.x{background:none;border:none;color:var(--mut);font-size:24px;cursor:pointer}
.toast{position:fixed;right:20px;bottom:20px;background:var(--grn);color:#052b21;padding:12px 18px;border-radius:12px;font-weight:600;z-index:200;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.gal .g{height:96px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;font-size:28px;cursor:pointer}
.gbig{height:330px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(135deg,#22355a,#131f36);display:grid;place-items:center;font-size:72px;margin-bottom:10px}
.gbig img{height:100%;width:100%;object-fit:cover}
ul.chk{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:9px}
ul.chk li{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-size:14px}
ul.chk li::before{content:"✔";color:var(--grn);margin-right:8px;font-weight:700}
footer{border-top:1px solid var(--line);padding:30px 0;color:var(--mut);font-size:13.5px;text-align:center;margin-top:40px}
.hide{display:none!important}
@media(max-width:900px){
  .hero-in,.grid3,.grid2,.frow,.feat,.stat,.radios,.cks,ul.chk{grid-template-columns:1fr}
  .hero h1{font-size:31px}
  .nav .lk{display:none} .nav.open .lk{display:block}
  .nav{flex-wrap:wrap;height:auto;padding:12px 0} .burger{display:block}
  .nav.open{gap:6px} .nav.open .lk{width:100%}
  .gal{grid-template-columns:repeat(2,1fr)}
}
@media print{
  header,footer,.noprint{display:none!important}
  body{background:#fff;color:#000}
  .bill,.panel,.note{border-color:#bbb;background:#fff;color:#000}
  table.bt th{background:#eee;color:#000} table.bt tr.sum td{color:#000;background:#f6f6f6}
}
</style>
</head>

/* คำนวณระยะทางจาก กม.สะสมของสถานีศูนย์กลาง */
function distance(aId,bId){
  const a=stn(aId),b=stn(bId); if(!a||!b) return 0;
  if(a.line===b.line||a.line==='hub'||b.line==='hub') return Math.abs(a.km-b.km);
  return a.km+b.km; // ต่างสายทาง → วิ่งผ่านสถานีศูนย์กลาง
}

/* =========================================================
   2) PRICING ENGINE
   ========================================================= */
function quote(f){
  const P=DB.pricing, c=car(f.carId); if(!c) return null;
  let km=distance(f.from,f.to);
  if(km<P.minDistance) km=P.minDistance;
  const legs=f.roundTrip?2:1;
  const totalKm=km*legs;
  const items=[];

  let rent=c.pricePerKm*totalKm*f.qty;
  let minApplied=false;
  const minTotal=c.minPrice*f.qty*legs;
  if(rent<minTotal){rent=minTotal;minApplied=true;}
  items.push({t:`ค่าเช่า ${c.name} × ${f.qty} ตู้`,
    d:minApplied?`คิดตามอัตราขั้นต่ำ ${num(c.minPrice)} บาท/ตู้/เที่ยว`
      :`${num(c.pricePerKm)} บาท/กม. × ${num(totalKm)} กม. × ${f.qty} ตู้`, v:rent});

  if(f.mode==='charter'){
    const loco=P.locoPerKm*totalKm;
    items.push({t:'ค่าหัวรถจักร (เหมาขบวนจัดเฉพาะ)',d:`${num(P.locoPerKm)} บาท/กม. × ${num(totalKm)} กม.`,v:loco});
  }else{
    items.push({t:'ค่าสับเปลี่ยน/พ่วงตู้เข้าขบวนปกติ',d:`เหมาจ่าย × ${legs} เที่ยว`,v:P.shunting*legs});
  }
  if(f.nights>0) items.push({t:'ค่าจอดพ่วงค้างคืน',d:`${num(P.overnight)} บาท/คืน × ${f.nights} คืน`,v:P.overnight*f.nights});
  items.push({t:'ค่าทำความสะอาดตู้',d:`${num(P.cleaning)} บาท/ตู้ × ${f.qty} ตู้`,v:P.cleaning*f.qty});
  const days=Math.max(1,f.nights+1);
  items.push({t:'ค่าเจ้าหน้าที่ประจำตู้',d:`${num(P.staffPerDay)} บาท/วัน × ${days} วัน × ${f.qty} ตู้`,v:P.staffPerDay*days*f.qty});

  let sub=items.reduce((s,i)=>s+i.v,0);
  if(f.holiday){const sur=sub*P.holidayPct/100;items.push({t:`ค่าธรรมเนียมช่วงเทศกาล (+${P.holidayPct}%)`,d:'คิดจากยอดก่อนภาษี',v:sur});sub+=sur;}
  const vat=sub*P.vat/100;
  return {km,totalKm,legs,items,sub,vat,total:sub+vat,carriage:c,minApplied,form:f};
}

function initCalc(){
  ['from','to'].forEach(k=>{
    const txt=document.getElementById(k+'Txt'), hid=document.getElementById(k), box=document.getElementById(k+'Drop');
    const show=q=>{
      const list=DB.stations.filter(s=>s.name.includes(q)||q==='').slice(0,40);
      box.innerHTML=`<div class="drop">${list.map(s=>`<div data-id="${s.id}" data-n="${esc(s.name)}">${esc(s.name)}<small>สาย${s.line==='hub'?'ศูนย์กลาง':esc(s.line)} · กม.${num(s.km)}</small></div>`).join('')||'<div><small>ไม่พบสถานี</small></div>'}</div>`;
      box.querySelectorAll('[data-id]').forEach(d=>d.onclick=()=>{txt.value=d.dataset.n;hid.value=d.dataset.id;box.innerHTML='';});
    };
    txt.oninput=()=>{hid.value='';show(txt.value)};
    txt.onfocus=()=>show(txt.value);
    document.addEventListener('click',e=>{if(!box.contains(e.target)&&e.target!==txt)box.innerHTML='';});
  });
  document.querySelectorAll('input[name=mode]').forEach(r=>r.onchange=()=>{
    document.getElementById('m_attach').classList.toggle('on',r.value==='attach'&&r.checked||document.querySelector('input[name=mode]:checked').value==='attach');
    document.getElementById('m_charter').classList.toggle('on',document.querySelector('input[name=mode]:checked').value==='charter');
  });
  document.getElementById('overnightChk').onchange=e=>document.getElementById('nightsBox').classList.toggle('hide',!e.target.checked);
}

function doCalc(){
  const g=id=>document.getElementById(id);
  const f={from:g('from').value,to:g('to').value,carId:g('carId').value,
    qty:Math.max(1,+g('qty').value||1),
    mode:document.querySelector('input[name=mode]:checked').value,
    d1:g('d1').value,d2:g('d2').value,
    roundTrip:g('roundTrip').checked, holiday:g('holiday').checked,
    nights:g('overnightChk').checked?Math.max(0,+g('nights').value||0):0,
    cname:g('cname').value,corg:g('corg').value};
  if(!f.from||!f.to){g('err').textContent='⚠ กรุณาเลือกสถานีต้นทางและปลายทางจากรายการที่ระบบแนะนำ';return;}
  if(f.from===f.to){g('err').textContent='⚠ สถานีต้นทางและปลายทางต้องไม่ซ้ำกัน';return;}
  const q=quote(f); if(!q){g('err').textContent='⚠ ไม่พบข้อมูลตู้รถไฟ';return;}
  STATE.result=q;
  DB.quotes.unshift({id:uid('q'),at:new Date().toISOString(),from:stn(f.from).name,to:stn(f.to).name,
    km:q.totalKm,car:q.carriage.name,qty:f.qty,mode:f.mode,total:q.total,cname:f.cname,corg:f.corg});
  DB.quotes=DB.quotes.slice(0,200); save();
  location.hash='#/result';
}

    tag:v('e_tag').trim(),emoji:v('e_emoji').trim()||'🚃',desc:v('e_desc').trim(),limit:v('e_limit').trim(),
    images:v('e_img').split('\n').map(s=>s.trim()).filter(Boolean),
    fac:[...document.querySelectorAll('.e_fac:checked')].map(x=>x.value)};
  if(!o.name||!o.pricePerKm){alert('กรุณากรอกชื่อตู้และราคาต่อกิโลเมตร');return;}
  const i=DB.carriages.findIndex(c=>c.id===id);
  i>=0?DB.carriages[i]=o:DB.carriages.push(o);
  save();closeModal();toast('บันทึกข้อมูลตู้รถไฟแล้ว');render();
}

/* ---- Station CRUD ---- */
function tabStn(){
  const lines=[...new Set(DB.stations.map(s=>s.line))];
  return `<div class="panel" style="margin-bottom:16px">
      <b>📐 หลักการคำนวณระยะทาง</b>
      <p style="color:var(--mut);font-size:13.5px;margin-top:6px">
        กรอก "ระยะทางสะสม (กม.)" ของแต่ละสถานีนับจากสถานีศูนย์กลาง (กม.0) ระบบจะหาผลต่างอัตโนมัติเมื่ออยู่สายเดียวกัน
        และรวมระยะทางผ่านศูนย์กลางเมื่อต่างสายทาง — ไม่ต้องกรอกตารางเมทริกซ์ทั้งหมด</p></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap">
      <div style="display:flex;gap:8px;align-items:center">
        <input id="dA" list="stnList" placeholder="สถานีต้นทาง" style="width:180px">
        <input id="dB" list="stnList" placeholder="สถานีปลายทาง" style="width:180px">
        <button class="btn btn-o btn-s" onclick="testDist()">🔍 ทดสอบระยะทาง</button>
        <span id="dOut" style="color:var(--gold);font-weight:700"></span>
        <datalist id="stnList">${DB.stations.map(s=>`<option value="${esc(s.name)}">`).join('')}</datalist>
      </div>
      <button class="btn btn-g btn-s" onclick="editStn()">➕ เพิ่มสถานี</button></div>
    <div class="scroll"><table class="tbl">
      <thead><tr><th>ชื่อสถานี</th><th>สายทาง</th><th>ระยะทางสะสม (กม.)</th><th style="text-align:right">จัดการ</th></tr></thead>
      <tbody>${DB.stations.slice().sort((a,b)=>a.line.localeCompare(b.line)||a.km-b.km).map(s=>`<tr>
        <td><b>${esc(s.name)}</b></td><td><span class="chip">${s.line==='hub'?'ศูนย์กลาง':esc(s.line)}</span></td>
        <td style="color:var(--gold)">${num(s.km)}</td>
        <td style="text-align:right;white-space:nowrap">
          <button class="btn btn-o btn-s" onclick="editStn('${s.id}')">แก้ไข</button>
          <button class="btn btn-d btn-s" onclick="delStn('${s.id}')">ลบ</button></td></tr>`).join('')}
      </tbody></table></div>`;
}
function testDist(){
  const a=DB.stations.find(s=>s.name===document.getElementById('dA').value);
  const b=DB.stations.find(s=>s.name===document.getElementById('dB').value);
  document.getElementById('dOut').textContent=(a&&b)?`= ${num(distance(a.id,b.id))} กม.`:'⚠ เลือกสถานีให้ถูกต้อง';
}
function delStn(id){if(confirm('ยืนยันลบสถานีนี้?')){DB.stations=DB.stations.filter(s=>s.id!==id);save();toast('ลบแล้ว');render();}}
function editStn(id){
  const s=stn(id)||{id:'',name:'',line:'',km:0};
  const lines=[...new Set(DB.stations.map(x=>x.line))];
  openModal(id?'แก้ไขสถานี':'เพิ่มสถานีใหม่',`
    <div class="fg"><label>ชื่อสถานี *</label><input id="s_name" value="${esc(s.name)}"></div>
    <div class="frow">
      <div class="fg"><label>สายทาง *</label><input id="s_line" list="lineList" value="${esc(s.line)}" placeholder="เช่น เหนือ / ใต้ / อีสานเหนือ">
        <datalist id="lineList">${lines.map(l=>`<option value="${esc(l)}">`).join('')}</datalist></div>
      <div class="fg"><label>ระยะทางสะสมจากศูนย์กลาง (กม.) *</label><input type="number" id="s_km" value="${s.km}"></div>
    </div>
    <button class="btn btn-g" style="width:100%" onclick="saveStn('${id||''}')">💾 บันทึก</button>`);
}
function saveStn(id){
  const v=i=>document.getElementById(i).value;
  const o={id:id||uid('s'),name:v('s_name').trim(),line:v('s_line').trim()||'อื่นๆ',km:+v('s_km')||0};
  if(!o.name){alert('กรุณากรอกชื่อสถานี');return;}
  const i=DB.stations.findIndex(s=>s.id===id);
  i>=0?DB.stations[i]=o:DB.stations.push(o);
  save();closeModal();toast('บันทึกสถานีแล้ว');render();
}

/* ---- Pricing ---- */
function tabPrice(){
  const P=DB.pricing;
  const row=(k,l,u,hint)=>`<div class="fg"><label>${l} <span style="color:var(--gold)">(${u})</span></label>
    <input type="number" step="any" id="p_${k}" value="${P[k]}">
    ${hint?`<small style="color:var(--mut);font-size:12.5px">${hint}</small>`:''}</div>`;
  return `<div class="grid2" style="align-items:start">
    <div class="panel">
      <h3 style="font-size:17px;margin-bottom:16px">💰 อัตราค่าบริการกลาง</h3>
      ${row('locoPerKm','ค่าเช่าหัวรถจักร','บาท/กม.','ใช้เมื่อเลือกรูปแบบ “เหมาขบวนจัดเฉพาะ”')}
      ${row('shunting','ค่าสับเปลี่ยน/พ่วงตู้','บาท/เที่ยว','ใช้เมื่อเลือก “พ่วงกับขบวนปกติ”')}
      ${row('overnight','ค่าจอดพ่วงค้างคืน','บาท/คืน')}
      ${row('cleaning','ค่าทำความสะอาดตู้','บาท/ตู้')}
      ${row('staffPerDay','ค่าเจ้าหน้าที่ประจำตู้','บาท/วัน/ตู้')}
      ${row('minDistance','ระยะทางขั้นต่ำที่คิดค่าบริการ','กม.','หากระยะทางจริงต่ำกว่านี้ ระบบจะคิดที่ค่านี้')}
      ${row('holidayPct','ค่าธรรมเนียมช่วงเทศกาล','%','คิดจากยอดรวมก่อนภาษี')}
      ${row('vat','ภาษีมูลค่าเพิ่ม','%')}
      <button class="btn btn-g" style="width:100%" onclick="savePrice()">💾 บันทึกโครงสร้างราคา</button>
    </div>
    <div class="panel">
      <h3 style="font-size:17px;margin-bottom:16px">🚃 เรทราคารายประเภทตู้</h3>
      <div class="scroll"><table class="tbl"><thead><tr><th>ตู้</th><th>บาท/กม.</th><th>ขั้นต่ำ</th></tr></thead><tbody>
      ${DB.carriages.map(c=>`<tr><td>${esc(c.name)}</td>
        <td><input type="number" style="padding:7px 9px" id="rk_${c.id}" value="${c.pricePerKm}"></td>
        <td><input type="number" style="padding:7px 9px" id="rm_${c.id}" value="${c.minPrice}"></td></tr>`).join('')}
      </tbody></table></div>
      <button class="btn btn-g" style="width:100%;margin-top:14px" onclick="saveRates()">💾 บันทึกเรทรายตู้</button>
      <div class="note" style="background:rgba(76,141,255,.08);border-color:rgba(76,141,255,.3);color:#bcd4ff">
        เมื่อบันทึก ระบบหน้าบ้านจะใช้อัตราใหม่ทันทีในการคำนวณครั้งถัดไป</div>
    </div></div>`;
}
function savePrice(){
  ['locoPerKm','shunting','overnight','cleaning','staffPerDay','minDistance','holidayPct','vat']
    .forEach(k=>DB.pricing[k]=+document.getElementById('p_'+k).value||0);
  save();toast('บันทึกโครงสร้างราคาแล้ว');render();
}
function saveRates(){
  DB.carriages.forEach(c=>{c.pricePerKm=+document.getElementById('rk_'+c.id).value||0;
    c.minPrice=+document.getElementById('rm_'+c.id).value||0;});
  save();toast('บันทึกเรทรายตู้แล้ว');render();
}

/* ---- Quotes log ---- */
function tabQuo(){
  if(!DB.quotes.length) return '<div class="panel" style="text-align:center;color:var(--mut)">ยังไม่มีใบประเมินที่บันทึกไว้</div>';
  return `<div style="display:flex;justify-content:flex-end;margin-bottom:14px">
      <button class="btn btn-d btn-s" onclick="if(confirm('ล้างประวัติทั้งหมด?')){DB.quotes=[];save();render();}">🗑 ล้างประวัติ</button></div>
    <div class="scroll"><table class="tbl">
    <thead><tr><th>วันที่</th><th>เส้นทาง</th><th>กม.</th><th>ตู้</th><th>รูปแบบ</th><th>ผู้ติดต่อ</th><th style="text-align:right">ยอดรวม</th></tr></thead>
    <tbody>${DB.quotes.map(q=>`<tr>
      <td><small>${new Date(q.at).toLocaleString('th-TH')}</small></td>
      <td>${esc(q.from)} → ${esc(q.to)}</td><td>${num(q.km)}</td>
      <td>${esc(q.car)} ×${q.qty}</td>
      <td><span class="chip">${q.mode==='charter'?'เหมาขบวน':'พ่วงขบวน'}</span></td>
      <td><small style="color:var(--mut)">${esc(q.cname||'-')}${q.corg?'<br>'+esc(q.corg):''}</small></td>
      <td style="text-align:right;color:var(--gold);font-weight:600">฿${num(Math.round(q.total))}</td></tr>`).join('')}
    </tbody></table></div>`;

/* ---- Admin accounts ---- */
function tabUsr(){
  return `<div style="display:flex;justify-content:flex-end;margin-bottom:14px">
      <button class="btn btn-g btn-s" onclick="editUsr()">➕ เพิ่มบัญชีผู้ดูแล</button></div>
    <div class="scroll"><table class="tbl">
    <thead><tr><th>ชื่อ-สกุล</th><th>ชื่อผู้ใช้</th><th>สิทธิ์</th><th style="text-align:right">จัดการ</th></tr></thead>
    <tbody>${DB.admins.map(a=>`<tr><td><b>${esc(a.name)}</b></td><td>${esc(a.user)}</td>
      <td><span class="chip" style="color:var(--gold2)">${esc(a.role)}</span></td>
      <td style="text-align:right;white-space:nowrap">
        <button class="btn btn-o btn-s" onclick="editUsr('${a.id}')">แก้ไข</button>
        ${DB.admins.length>1?`<button class="btn btn-d btn-s" onclick="delUsr('${a.id}')">ลบ</button>`:''}</td></tr>`).join('')}
    </tbody></table></div>`;
}
function delUsr(id){
  if(id===ADMIN.id){alert('ไม่สามารถลบบัญชีที่กำลังใช้งานอยู่');return;}
  if(confirm('ยืนยันลบบัญชีนี้?')){DB.admins=DB.admins.filter(a=>a.id!==id);save();toast('ลบแล้ว');render();}
}
function editUsr(id){
  const a=DB.admins.find(x=>x.id===id)||{id:'',user:'',pass:'',name:'',role:'Staff'};
  openModal(id?'แก้ไขบัญชีผู้ดูแล':'เพิ่มบัญชีผู้ดูแล',`
    <div class="frow"><div class="fg"><label>ชื่อ-สกุล *</label><input id="u_name" value="${esc(a.name)}"></div>
    <div class="fg"><label>สิทธิ์การใช้งาน</label><select id="u_role">
      ${['Super Admin','Admin','Staff'].map(r=>`<option ${a.role===r?'selected':''}>${r}</option>`).join('')}</select></div></div>
    <div class="frow"><div class="fg"><label>ชื่อผู้ใช้ *</label><input id="u_user" value="${esc(a.user)}"></div>
    <div class="fg"><label>รหัสผ่าน *</label><input id="u_pass" value="${esc(a.pass)}"></div></div>
    <button class="btn btn-g" style="width:100%" onclick="saveUsr('${id||''}')">💾 บันทึก</button>`);
}
function saveUsr(id){
  const v=i=>document.getElementById(i).value.trim();
  const o={id:id||uid('a'),name:v('u_name'),user:v('u_user'),pass:v('u_pass'),role:v('u_role')};
  if(!o.name||!o.user||!o.pass){alert('กรุณากรอกข้อมูลให้ครบ');return;}
  if(DB.admins.some(x=>x.user===o.user&&x.id!==id)){alert('ชื่อผู้ใช้นี้ถูกใช้แล้ว');return;}
  const i=DB.admins.findIndex(x=>x.id===id);
  i>=0?DB.admins[i]=o:DB.admins.push(o);
  save();closeModal();toast('บันทึกบัญชีแล้ว');render();
}

/* ---- Modal ---- */
function openModal(title,body){
  const m=document.createElement('div');m.className='modal';m.id='modal';
  m.innerHTML=`<div class="modal-in"><div class="mh"><h3>${title}</h3><button class="x" onclick="closeModal()">×</button></div>${body}</div>`;
  m.onclick=e=>{if(e.target===m)closeModal()};
  document.body.appendChild(m);
}
function closeModal(){document.getElementById('modal')?.remove()}
</script>
</body>
